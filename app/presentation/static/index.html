<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>My English Buddy</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .dot {
      margin-left: auto;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .dot.on { background: #22c55e; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      font-size: 15px;
      text-align: center;
      padding: 32px;
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.5;
      animation: pop 0.2s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble.user {
      align-self: flex-end;
      background: #667eea;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.buddy {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .bubble .name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      opacity: 0.65;
      margin-bottom: 3px;
    }

    footer {
      padding: 16px 16px 32px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #status {
      font-size: 13px;
      color: #9ca3af;
      min-height: 18px;
      text-align: center;
    }

    #talkBtn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(102,126,234,0.45);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      outline: none;
    }

    #talkBtn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #talkBtn.recording {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 0 0 rgba(239,68,68,0.5);
      animation: ring 1s ease-in-out infinite;
    }

    @keyframes ring {
      0%,100% { box-shadow: 0 0 0 0   rgba(239,68,68,0.45); }
      50%      { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }
  </style>
</head>
<body>

<header>
  <div class="avatar">&#127891;</div>
  <h1>My English Buddy</h1>
  <div class="dot" id="dot"></div>
</header>

<div id="messages">
  <div class="empty" id="empty">Hold the button below to start talking!</div>
</div>

<footer>
  <div id="status">Connecting&hellip;</div>
  <button id="talkBtn" disabled>&#127908;</button>
</footer>

<script>
  const btn    = document.getElementById('talkBtn');
  const status = document.getElementById('status');
  const msgs   = document.getElementById('messages');
  const dot    = document.getElementById('dot');
  const empty  = document.getElementById('empty');

  let ws             = null;
  let recorder       = null;
  let chunks         = [];
  let recording      = false;
  let audioCtx       = null;
  let playingSource  = null;

  /* ── helpers ─────────────────────────────────────── */

  function setStatus(text) { status.textContent = text; }

  function addBubble(role, text) {
    empty?.remove();
    const wrap = document.createElement('div');
    wrap.className = `bubble ${role}`;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = role === 'user' ? 'You' : 'Buddy';
    const body = document.createElement('div');
    body.textContent = text;
    wrap.appendChild(name);
    wrap.appendChild(body);
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function playMp3(b64) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const binary = atob(b64);
    const buf = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) buf[i] = binary.charCodeAt(i);

    const decoded = await audioCtx.decodeAudioData(buf.buffer);
    const src = audioCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(audioCtx.destination);
    playingSource = src;
    return new Promise(resolve => { src.onended = resolve; src.start(0); });
  }

  /* ── WebSocket ───────────────────────────────────── */

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      dot.classList.add('on');
      btn.disabled = false;
      setStatus('Hold button to speak');
    };

    ws.onclose = () => {
      dot.classList.remove('on');
      btn.disabled = true;
      setStatus('Disconnected \u2014 reconnecting\u2026');
      setTimeout(connect, 2500);
    };

    ws.onerror = () => setStatus('Connection error');

    ws.onmessage = async (ev) => {
      const msg = JSON.parse(ev.data);

      if (msg.type === 'status') {
        const map = {
          transcribing: 'Transcribing\u2026',
          thinking:     'Thinking\u2026',
          synthesizing: 'Speaking\u2026',
          ready:        'Hold button to speak',
          no_speech:    'No speech detected \u2014 try again',
        };
        setStatus(map[msg.message] ?? msg.message);

      } else if (msg.type === 'transcript') {
        addBubble('user', msg.text);

      } else if (msg.type === 'reply') {
        addBubble('buddy', msg.text);
        if (msg.audio) {
          btn.disabled = true;
          setStatus('Playing\u2026');
          try { await playMp3(msg.audio); } catch (e) { console.warn('audio', e); }
          btn.disabled = false;
          setStatus('Hold button to speak');
        }

      } else if (msg.type === 'error') {
        setStatus(`Error: ${msg.message}`);
        btn.disabled = false;
      }
    };
  }

  /* ── recording ───────────────────────────────────── */

  async function startRec() {
    if (recording || btn.disabled) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','']
        .find(t => !t || MediaRecorder.isTypeSupported(t));
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
      chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType });
        const reader = new FileReader();
        reader.onloadend = () => {
          const b64 = reader.result.split(',')[1];
          ws.send(JSON.stringify({ type: 'audio', mime_type: recorder.mimeType || 'audio/webm', data: b64 }));
          setStatus('Transcribing\u2026');
        };
        reader.readAsDataURL(blob);
      };
      recorder.start();
      recording = true;
      btn.classList.add('recording');
      setStatus('Recording\u2026 release to send');
    } catch {
      setStatus('Microphone access denied');
    }
  }

  function stopRec() {
    if (!recording || !recorder) return;
    recorder.stop();
    recording = false;
    btn.classList.remove('recording');
  }

  /* ── button events ───────────────────────────────── */

  btn.addEventListener('touchstart', e => { e.preventDefault(); startRec(); }, { passive: false });
  btn.addEventListener('touchend',   e => { e.preventDefault(); stopRec();  }, { passive: false });
  btn.addEventListener('touchcancel',e => { e.preventDefault(); stopRec();  }, { passive: false });
  btn.addEventListener('mousedown',  () => startRec());
  btn.addEventListener('mouseup',    () => stopRec());
  btn.addEventListener('mouseleave', () => stopRec());

  connect();
</script>
</body>
</html>
